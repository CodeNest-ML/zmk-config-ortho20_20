# ZMK Studio Support
CONFIG_ZMK_STUDIO=y

# Bluetooth Power Increase (Helps with connection stability)
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Experimental BLE features for better Windows/Laptop compatibility
CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=y

# Cancel the passkey code: the host pairs with Just Works, so no 6-digit
# pairing code is requested. An explicit "n" overrides the value implied
# by ZMK_BLE_EXPERIMENTAL_SEC (BT_SMP_ALLOW_UNAUTH_OVERWRITE).
CONFIG_ZMK_BLE_PASSKEY_ENTRY=n
